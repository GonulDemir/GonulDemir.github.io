name: Restore Published Website

on:
  push:
    branches: [main]
    paths: ['.github/workflows/restore-published-site.yml']

permissions:
  contents: write

concurrency:
  group: restore-published-website
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout publication repository
        uses: actions/checkout@v4
      - name: Download and validate static publication package
        env:
          PACKAGE_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-89c4-81f5-8251-39c59d1d1f72/raw?se=2026-09-23T16%3A01%3A07Z&sp=r&sv=2026-02-06&sr=b&scid=15656035-115e-5c9f-989d-d05cfdbc372b&skoid=b5d2651b-fef3-4bb0-a03b-ca59cc22929b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-23T15%3A08%3A16Z&ske=2026-09-24T15%3A08%3A16Z&sks=b&skv=2026-02-06&sig=ui2EJHWwOTG%2BP1ffGNPc/2DPFhum7s0rs3i74q/PyOM%3D'
          EXPECTED_SHA256: ef7733384928206fd4a73506dda4516ae9a2876d0fbcfc0d8d7c821f1e7e99f3
        shell: bash
        run: |
          echo "::add-mask::$PACKAGE_URL"
          curl --fail --location --retry 2 --max-time 120 "$PACKAGE_URL" --output "$RUNNER_TEMP/publication.zip"
          python3 - <<'PY'
          import os, hashlib, zipfile, stat
          from pathlib import Path, PurePosixPath
          archive = Path(os.environ['RUNNER_TEMP']) / 'publication.zip'
          if hashlib.sha256(archive.read_bytes()).hexdigest() != os.environ['EXPECTED_SHA256']:
              raise RuntimeError('Publication package checksum mismatch')
          destination = Path(os.environ['RUNNER_TEMP']) / 'publication'
          destination.mkdir(exist_ok=False)
          allowed_roots = {'_astro', 'about', 'articles', 'contact', 'downloads', 'expertise', 'free-zone', 'images', 'projects'}
          allowed_extensions = {'.html', '.css', '.js', '.png', '.jpg', '.jpeg', '.gif', '.svg', '.webp', '.avif', '.ico', '.pdf', '.woff', '.woff2', '.ttf', '.otf', '.xml', '.txt'}
          with zipfile.ZipFile(archive) as z:
              files = [item for item in z.infolist() if not item.is_dir()]
              if len(files) != 326 or sum(item.file_size for item in files) > 256 * 1024 * 1024:
                  raise RuntimeError('Unexpected package structure')
              for item in files:
                  relative = PurePosixPath(item.filename)
                  if relative.is_absolute() or '..' in relative.parts or '\\' in item.filename:
                      raise RuntimeError('Unsafe archive path')
                  if stat.S_ISLNK(item.external_attr >> 16):
                      raise RuntimeError('Archive symlink rejected')
                  if item.filename != '.nojekyll':
                      if any(part.startswith('.') for part in relative.parts):
                          raise RuntimeError('Unexpected hidden file')
                      if len(relative.parts) > 1 and relative.parts[0] not in allowed_roots:
                          raise RuntimeError('Unexpected source directory')
                      sheet = relative.parts[0] == 'downloads' and relative.suffix.lower() in {'.ods', '.xlsx'}
                      if relative.suffix.lower() not in allowed_extensions and not sheet:
                          raise RuntimeError('Unexpected source file')
                  path = destination / item.filename
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(z.read(item))
          for name in ['index.html', 'about/index.html', 'articles/index.html', 'projects/index.html', 'contact/index.html', '_astro/_slug_.CImMp5ia.css', '.nojekyll']:
              if not (destination / name).is_file():
                  raise RuntimeError(f'Required publication file missing: {name}')
          print('Verified 326 static publication files; no development source files included.')
          PY
      - name: Commit publication files
        shell: bash
        run: |
          rsync -a --delete --exclude='.git/' --exclude='.github/' "$RUNNER_TEMP/publication/" ./
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m 'Publish rebuilt website with complete styles, pages and images'
            git push origin HEAD:main
          fi
