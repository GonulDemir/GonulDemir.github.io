<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Architecture of the 1-30 MHz, 1.3 kW solid-state SP2T RF switch</title>
  <desc id="desc">External controls pass through protection and optocouplers, safety logic, an isolated dual gate driver and floating gate-bias supplies. Two back-to-back SiC MOSFET pairs route a common RF input to either an antenna and test port or a dummy load.</desc>
  <defs>
    <style>
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 14; }
      .domain { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 10 8; rx: 20; }
      .rf { fill: #fff7ed; stroke: #c2410c; stroke-width: 3; rx: 14; }
      .power { fill: #f0fdf4; stroke: #15803d; stroke-width: 2; rx: 14; }
      .title { font: 600 30px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
      .label { font: 600 21px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
      .small { font: 400 17px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; }
      .tiny { font: 400 15px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #64748b; }
      .arrow { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
      .rfline { fill: none; stroke: #c2410c; stroke-width: 5; marker-end: url(#rfarrow); }
      .bias { fill: none; stroke: #15803d; stroke-width: 3; marker-end: url(#greenarrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker>
    <marker id="rfarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/></marker>
    <marker id="greenarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/></marker>
  </defs>

  <rect width="1600" height="760" fill="#ffffff"/>
  <text x="800" y="52" text-anchor="middle" class="title">Solid-State SP2T RF Switch - Functional Architecture</text>

  <rect x="35" y="90" width="930" height="550" class="domain"/>
  <text x="60" y="125" class="small">CONTROL AND GATE-DRIVE DOMAINS</text>

  <rect x="70" y="175" width="210" height="155" class="box"/>
  <text x="175" y="214" text-anchor="middle" class="label">External Control</text>
  <text x="175" y="250" text-anchor="middle" class="small">SW_A / SW_B</text>
  <text x="175" y="277" text-anchor="middle" class="small">RF_SAFE / ENABLE</text>
  <text x="175" y="307" text-anchor="middle" class="tiny">D-sub interface</text>

  <rect x="330" y="175" width="220" height="155" class="box"/>
  <text x="440" y="214" text-anchor="middle" class="label">Protection &amp;</text>
  <text x="440" y="241" text-anchor="middle" class="label">Isolation</text>
  <text x="440" y="278" text-anchor="middle" class="small">TVS + RC input</text>
  <text x="440" y="305" text-anchor="middle" class="small">TLP291-4</text>

  <rect x="600" y="175" width="220" height="155" class="box"/>
  <text x="710" y="214" text-anchor="middle" class="label">Safety Logic</text>
  <text x="710" y="251" text-anchor="middle" class="small">SN74HC08</text>
  <text x="710" y="278" text-anchor="middle" class="small">RF-safe gating</text>
  <text x="710" y="305" text-anchor="middle" class="small">default OFF state</text>

  <rect x="600" y="420" width="220" height="155" class="box"/>
  <text x="710" y="459" text-anchor="middle" class="label">Isolated Driver</text>
  <text x="710" y="496" text-anchor="middle" class="small">UCC21550</text>
  <text x="710" y="523" text-anchor="middle" class="small">dead time + disable</text>
  <text x="710" y="550" text-anchor="middle" class="tiny">independent A/B outputs</text>

  <rect x="70" y="420" width="430" height="155" class="power"/>
  <text x="285" y="459" text-anchor="middle" class="label">Two Floating Gate-Bias Supplies</text>
  <text x="285" y="496" text-anchor="middle" class="small">QA053C-1803R3 x 2</text>
  <text x="285" y="523" text-anchor="middle" class="small">+18 V ON / -3.5 V OFF</text>
  <text x="285" y="550" text-anchor="middle" class="tiny">referenced to Kelvin_A and Kelvin_B</text>

  <path d="M280 252 H330" class="arrow"/>
  <path d="M550 252 H600" class="arrow"/>
  <path d="M710 330 V420" class="arrow"/>
  <path d="M500 497 H600" class="bias"/>

  <rect x="1015" y="90" width="550" height="550" class="domain"/>
  <text x="1040" y="125" class="small">FLOATING RF POWER STAGE</text>

  <rect x="1060" y="175" width="200" height="100" class="rf"/>
  <text x="1160" y="214" text-anchor="middle" class="label">RF COMMON</text>
  <text x="1160" y="246" text-anchor="middle" class="small">1-30 MHz / 50 ohm</text>

  <rect x="1320" y="150" width="200" height="125" class="rf"/>
  <text x="1420" y="188" text-anchor="middle" class="label">Branch A</text>
  <text x="1420" y="220" text-anchor="middle" class="small">Q1 + Q2</text>
  <text x="1420" y="249" text-anchor="middle" class="tiny">back-to-back SiC pair</text>

  <rect x="1320" y="405" width="200" height="125" class="rf"/>
  <text x="1420" y="443" text-anchor="middle" class="label">Branch B</text>
  <text x="1420" y="475" text-anchor="middle" class="small">Q4 + Q3</text>
  <text x="1420" y="504" text-anchor="middle" class="tiny">back-to-back SiC pair</text>

  <rect x="1320" y="305" width="200" height="60" class="box"/>
  <text x="1420" y="342" text-anchor="middle" class="small">ANTENNA / TEST</text>

  <rect x="1320" y="565" width="200" height="60" class="box"/>
  <text x="1420" y="602" text-anchor="middle" class="small">DUMMY LOAD</text>

  <path d="M1260 225 H1320" class="rfline"/>
  <path d="M1260 225 C1285 225 1285 468 1320 468" class="rfline"/>
  <path d="M1420 275 V305" class="rfline"/>
  <path d="M1420 530 V565" class="rfline"/>

  <path d="M820 470 H990 V350 H1280 V260 H1320" class="arrow"/>
  <path d="M820 525 H1185 V505 H1320" class="arrow"/>
  <text x="1010" y="340" class="tiny">GATE_A / Kelvin_A</text>
  <text x="1010" y="515" class="tiny">GATE_B / Kelvin_B</text>

  <text x="800" y="700" text-anchor="middle" class="small">Route changes are slow control events; the selected path carries the continuous HF waveform.</text>
  <text x="800" y="731" text-anchor="middle" class="tiny">Target performance will be established by low-power VNA measurements before staged high-power tests.</text>
</svg>
